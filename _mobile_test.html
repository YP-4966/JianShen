<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mobile Layout Test</title>
<style>
  body { margin: 0; background: #ddd; display: flex; gap: 12px; padding: 12px; font-family: sans-serif; }
  .frame { width: 390px; height: 844px; border: 2px solid #333; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.3); position: relative; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; }
  .note { font-size: 13px; color: #444; }
</style>
</head>
<body>
  <div class="frame">
    <iframe id="site" src="index.html" title="site"></iframe>
  </div>
  <div class="note">iPhone 14 viewport: 390 x 844</div>
</body>
</html>
