<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="健身房器械使用指南：有氧器械、固定器械、自由重量、自重训练的动作要领、注意事项与常见错误">
  <title>健身房器械使用指南</title>
  <link rel="stylesheet" href="css/style.css?v=21">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="健身指南">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top">
        <span class="logo-icon">🏋️</span>
        <span>健身房器械使用指南</span>
      </a>
      <nav class="header-nav">
        <a href="#cat-warmup">热身</a>
        <a href="#cat-chest">胸部</a>
        <a href="#cat-shoulder">肩部</a>
        <a href="#cat-back">背部</a>
        <a href="#cat-glute">臀部</a>
        <a href="#cat-leg">腿部</a>
        <a href="#cat-arm">手臂</a>
        <a href="#cat-core">核心</a>
        <a href="#cat-cardio">有氧</a>
      </nav>
      <div class="header-actions">
        <button class="nav-action" id="nav-fav" aria-label="我的收藏" title="我的收藏"><span>❤️</span><span class="nav-text">收藏</span><span class="badge-count" id="fav-count" hidden></span></button>
        <button class="nav-action" id="nav-logs" aria-label="训练记录" title="训练记录"><span>📝</span><span class="nav-text">记录</span></button>
      </div>
    </div>
  </header>

  <!-- 搜索与筛选（吸顶固定） -->
  <div class="toolbar" id="toolbar">
    <select id="filter-equipment" aria-label="按器械筛选"></select>
    <select id="filter-level" aria-label="按难度筛选">
      <option value="">全部难度</option>
      <option value="初级">初级</option>
      <option value="中级">中级</option>
      <option value="高级">高级</option>
    </select>
    <input type="search" id="search-input" placeholder="🔍 搜索动作，如：卧推、深蹲、引体…" autocomplete="off" aria-label="搜索动作">
  </div>

  <!-- 首屏 -->
  <section class="hero" id="top">
    <span class="hero-badge">新手友好 · 图文并茂 · 动作演示</span>
    <h1>科学训练，<span class="accent">从认识器械开始</span></h1>
    <p>覆盖训练前热身 + 全身 9 个训练部位、最常见的健身动作，每项都配有动图演示、详细步骤、注意事项和常见错误，帮你按部位科学规划训练。</p>
    <div class="hero-stats">
      <div class="stat"><b id="stat-total">65</b><span>经典动作</span></div>
      <div class="stat"><b id="stat-cat">9</b><span>训练部位</span></div>
      <div class="stat"><b>100%</b><span>动图演示</span></div>
    </div>
  </section>

  <!-- 分类说明 -->
  <div class="cat-intro" id="cat-intro"></div>

  <!-- 主体内容 -->
  <main id="main-content"></main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>动作演示动图来自 <a href="https://exercisedb.dev/" target="_blank" rel="noopener">ExerciseDB</a> 开源数据集 · 内容仅供学习参考</p>
      <p style="margin-top:4px;">训练前请充分热身，如有伤病请咨询专业人士</p>
    </div>
  </footer>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3 id="modal-title"></h3>
          <div class="en" id="modal-en"></div>
        </div>
        <div class="modal-head-actions">
          <button class="modal-fav" id="modal-fav" aria-label="收藏">🤍</button>
          <button class="modal-close" id="modal-close" aria-label="关闭">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-media" id="modal-media"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-target" id="modal-target"></div>
        <div class="modal-section">
          <h4><span class="dot"></span>动作步骤</h4>
          <ol id="modal-steps"></ol>
        </div>
        <div class="modal-section">
          <h4><span class="dot"></span>注意事项</h4>
          <ul id="modal-tips"></ul>
        </div>
        <div class="modal-section mistake">
          <h4><span class="dot"></span>常见错误</h4>
          <ul id="modal-mistakes"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 训练记录弹窗 -->
  <div class="log-overlay" id="log-overlay" role="dialog" aria-modal="true">
    <div class="log-modal">
      <div class="log-head">
        <h3>📝 训练记录</h3>
        <button class="modal-close" id="log-close" aria-label="关闭">✕</button>
      </div>
      <div class="log-body">
        <div class="log-form">
          <h4>记一笔</h4>
          <div class="log-field field-full">
            <label for="log-exercise">🏋️ 选择动作</label>
            <select id="log-exercise" aria-label="选择动作"><option value="">选择动作…</option></select>
          </div>
          <div class="log-fields-row">
            <div class="log-field">
              <label for="log-date">📅 日期</label>
              <input type="date" id="log-date">
            </div>
            <div class="log-field">
              <label for="log-sets">🔢 组数</label>
              <input type="number" id="log-sets" min="1" max="20" placeholder="3">
            </div>
            <div class="log-field">
              <label for="log-reps">🔁 次数</label>
              <input type="number" id="log-reps" min="1" max="200" placeholder="12">
            </div>
            <div class="log-field">
              <label for="log-weight">⚖️ 重量kg</label>
              <input type="number" id="log-weight" min="0" step="0.5" placeholder="自重可空">
            </div>
          </div>
          <div class="log-actions">
            <button class="log-save" id="log-save">保存记录</button>
            <span class="log-msg" id="log-msg"></span>
          </div>
        </div>
        <div class="log-stats" id="log-stats"></div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>

  <!-- 底部菜单栏 -->
  <nav class="tab-bar" id="tab-bar" aria-label="底部菜单">
    <button class="tab-item on" id="tab-train" aria-label="训练"><span class="tab-ico">🏋️</span><span class="tab-text">训练</span></button>
    <button class="tab-item" id="tab-log" aria-label="记录"><span class="tab-ico">📝</span><span class="tab-text">记录</span></button>
    <button class="tab-item" id="tab-fav" aria-label="收藏"><span class="tab-ico">❤️<span class="tab-badge" id="tab-fav-count" hidden></span></span><span class="tab-text">收藏</span></button>
  </nav>

  <!-- 回到顶部 -->
  <button class="back-top" id="back-top" aria-label="回到顶部">↑</button>

  <script src="js/data.js?v=21"></script>
  <script src="js/main.js?v=21"></script>
  <script>
    // PWA：注册 Service Worker 实现离线缓存与安装能力
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
